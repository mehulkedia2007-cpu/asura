name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shared engine. Pure, fast, no services — it must stay that way.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: lint
        run: uv run ruff check .
      - name: tests (incl. hypothesis invariants + AST shared-engine test)
        run: uv run pytest -q

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: daari
          POSTGRES_PASSWORD: daari
          POSTGRES_DB: daari
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daari -d daari"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://daari:daari@localhost:5432/daari
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: lint
        run: uv run ruff check .
      - name: types
        run: uv run pyright
      - name: migrations
        run: uv run alembic upgrade head
      - name: tests
        run: uv run pytest -q
      - name: P5 session persistence and concurrency
        run: uv run python scripts/check_p5.py
      - name: P5 interview, notice and feedback golden sets
        run: uv run python ../../evals/run_p5.py
      - name: P3 safety and scheme retrieval golden sets
        run: uv run python ../../evals/run_p3.py --snapshot
      - name: P7 deterministic rehearsal audit
        run: uv run python ../../evals/run_p7.py --audit

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: types
        run: pnpm typecheck
      - name: unit tests
        run: pnpm test
      - name: locale key coverage
        run: python3 ../../evals/i18n_check.py
      - name: build
        run: pnpm build
